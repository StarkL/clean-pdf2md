[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-pdf2md"
version = "0.1.0"
description = "Lightweight, Zero-GPU PDF-to-Markdown Converter with Smart Noise Removal and Image Anchoring"
readme = "README.md"
authors = [{ name = "CleanPDF2MD Team" }]
license = { text = "MIT" }
keywords = ["pdf", "markdown", "ocr", "knowledge-base", "rag", "wechat", "document-parser"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.24.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pillow>=9.0.0",
]

[project.scripts]
clean-pdf2md = "clean_pdf2md.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/clean-pdf2md"
Repository = "https://github.com/your-username/clean-pdf2md"
Issues = "https://github.com/your-username/clean-pdf2md/issues"
